spring.application.name=playbook-service
ih.demo.task-completion-enabled=${IH_DEMO_TASK_COMPLETION_ENABLED:false}
server.port=${IH_PLAYBOOK_PORT:18083}
spring.datasource.url=${IH_PLAYBOOK_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=investigation_flowable,investigation_playbook}
spring.datasource.username=${IH_DB_USER:postgres}
spring.datasource.password=${IH_DB_PASSWORD:}
spring.flyway.default-schema=investigation_playbook
spring.flyway.schemas=investigation_playbook
spring.flyway.create-schemas=true
flowable.database-schema-update=true
flowable.database-schema=investigation_flowable
ih.outbox.schema=investigation_playbook
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [correlationId=%X{correlationId}]
