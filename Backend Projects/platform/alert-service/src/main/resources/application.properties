spring.application.name=alert-service
server.port=${IH_ALERT_PORT:18084}
spring.datasource.url=${IH_ALERT_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=investigation_alert}
spring.datasource.username=${IH_DB_USER:postgres}
spring.datasource.password=${IH_DB_PASSWORD:}
spring.flyway.default-schema=investigation_alert
spring.flyway.schemas=investigation_alert
spring.flyway.create-schemas=true
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [correlationId=%X{correlationId}]
ih.case.base-url=${IH_CASE_URL:http://localhost:18082}
