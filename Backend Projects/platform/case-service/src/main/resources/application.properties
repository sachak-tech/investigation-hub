spring.application.name=case-service
server.port=${IH_CASE_PORT:18082}
spring.datasource.url=${IH_CASE_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=investigation_case}
spring.datasource.username=${IH_DB_USER:postgres}
spring.datasource.password=${IH_DB_PASSWORD:}
spring.flyway.default-schema=investigation_case
spring.flyway.schemas=investigation_case
spring.flyway.create-schemas=true
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [correlationId=%X{correlationId}]
ih.policy.base-url=${IH_POLICY_URL:http://localhost:18081}
ih.playbook.base-url=${IH_PLAYBOOK_URL:http://localhost:18083}
