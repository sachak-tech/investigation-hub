spring.application.name=policy-service
server.port=${IH_POLICY_PORT:18081}
spring.datasource.url=${IH_POLICY_DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=investigation_policy}
spring.datasource.username=${IH_DB_USER:postgres}
spring.datasource.password=${IH_DB_PASSWORD:}
spring.flyway.default-schema=investigation_policy
spring.flyway.schemas=investigation_policy
spring.flyway.create-schemas=true
management.endpoint.health.probes.enabled=true
management.endpoints.web.exposure.include=health,info
logging.pattern.level=%5p [correlationId=%X{correlationId}]
